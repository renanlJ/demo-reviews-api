apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: demo-reviews-api
  description: >
    Customer reviews service (Python / FastAPI) — reviewer name, review
    text, rating and creation date per product.
  tags:
    - demo-commerce
    - lang-python
    - framework-fastapi
    - app-backend-api
    - criticality-medium
    - runtime-cpython
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  type: service
  lifecycle: production
  owner: group:default/platform-team
  system: demo-commerce
  providesApis:
    - reviews-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: reviews-api
  description: Customer reviews REST API.
  tags:
    - api-rest
    - demo-commerce
spec:
  type: openapi
  lifecycle: production
  owner: group:default/platform-team
  system: demo-commerce
  definition:
    $text: ./docs/api/openapi.yaml
