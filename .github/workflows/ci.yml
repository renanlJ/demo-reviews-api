name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: demo-reviews-api
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint, unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Format check (ruff)
        run: ruff format --check app tests
      - name: Type check (mypy)
        run: mypy app
      - name: Unit tests with coverage
        run: pytest --cov=app --cov-report=xml --cov-report=term --junitxml=test-results/junit.xml
      - name: Upload test and coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            coverage.xml
            test-results/junit.xml

  security:
    name: SAST, SCA and secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: SAST (bandit)
        run: |
          pip install bandit==1.9.4
          bandit -r app -f sarif -o bandit.sarif || true
          bandit -r app --exit-zero
      - name: SCA (pip-audit)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
      - name: Filesystem scan (trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload SAST report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports
          path: bandit.sarif

  build:
    name: Build check
    runs-on: ubuntu-latest
    needs: [quality, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Compile check
        run: python -m compileall -q app

  image:
    name: Container image build and scan
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image (trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
      - name: Upload image scan report
        uses: actions/upload-artifact@v4
        with:
          name: image-scan-reports
          path: trivy-image.sarif
      - name: Publish to GHCR (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag "$IMAGE_NAME:ci" "$REPO:${GITHUB_REF_NAME#v}"
          docker tag "$IMAGE_NAME:ci" "$REPO:latest"
          docker push "$REPO:${GITHUB_REF_NAME#v}"
          docker push "$REPO:latest"
